[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "retinal-vessel-segmentation"
version = "0.1.0"
description = "Morphological segmentation of retinal vessels in SLO images (IOSTAR)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.26",
    "pillow>=10",
    "pandas>=2",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
learning = ["torch>=2.2"]  # U-Net comparison (vessels.unet, scripts/cv_unet*.py)

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
